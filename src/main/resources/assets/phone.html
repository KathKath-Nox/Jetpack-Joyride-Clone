<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jetpack Joyride</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; }
  #app { display: flex; height: 100%; gap: 10px; padding: 10px; box-sizing: border-box; }
  #side { flex: 0 0 38%; display: grid; grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(4, 1fr); gap: 8px; }
  #side button { font-size: 6vmin; background: #333; color: #eee; border: 2px solid #777;
    border-radius: 12px; touch-action: manipulation; }
  #side button:active { background: #555; }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #ok { grid-column: 2; grid-row: 2; background: #2d6a2d; }
  #right { grid-column: 3; grid-row: 2; }
  #down { grid-column: 2; grid-row: 3; }
  #back { grid-column: 1 / 3; grid-row: 4; font-size: 4.5vmin; }
  #pause { grid-column: 3; grid-row: 4; font-size: 4.5vmin; }
  #pad { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 8vmin;
    background: #1c2a3a; border-radius: 16px; text-align: center; }
  #pad.on { background: #e8a317; color: #111; }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <button id="up">&#9650;</button>
    <button id="left">&#9664;</button>
    <button id="ok">OK</button>
    <button id="right">&#9654;</button>
    <button id="down">&#9660;</button>
    <button id="back">RETOUR</button>
    <button id="pause">PAUSE</button>
  </div>
  <div id="pad">JETPACK<br>(maintenir)</div>
</div>
<script>
  let seq = 0;
  let timer = null;
  const pad = document.getElementById('pad');
  function send(cmd) {
    fetch('input', { method: 'POST', body: (++seq) + ':' + cmd, keepalive: true }).catch(() => {});
  }
  function down(e) {
    e.preventDefault();
    if (timer) return;
    pad.classList.add('on');
    send('down');
    timer = setInterval(() => send('down'), 100);
  }
  function up(e) {
    e.preventDefault();
    if (!timer) return;
    clearInterval(timer);
    timer = null;
    pad.classList.remove('on');
    send('up');
  }
  pad.addEventListener('touchstart', down, { passive: false });
  pad.addEventListener('touchend', up, { passive: false });
  pad.addEventListener('touchcancel', up, { passive: false });
  pad.addEventListener('mousedown', down);
  pad.addEventListener('mouseup', up);
  pad.addEventListener('mouseleave', up);
  const keys = { up: 'UP', down: 'DOWN', left: 'LEFT', right: 'RIGHT', ok: 'ENTER', back: 'ESCAPE' };
  for (const id in keys) {
    document.getElementById(id).addEventListener('click', () => send('key:' + keys[id]));
  }
  document.getElementById('pause').addEventListener('click', () => send('pause'));
  document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
